version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notas_entrega_web
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      # Here you can map other environment variables, for example:
      # - DB_PROFIT_2K8_SERVER=${DB_PROFIT_2K8_SERVER}
      # - DB_PROFIT_2K8_USER=${DB_PROFIT_2K8_USER}
      # - DB_PROFIT_2K8_PASSWORD=${DB_PROFIT_2K8_PASSWORD}
      # - DB_PROFIT_2K8_DATABASE=${DB_PROFIT_2K8_DATABASE}
    env_file:
      - .env
    depends_on:
      - sql_server

  sql_server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: notas_entrega_db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperSecurePass123!
      - MSSQL_PID=Express
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

volumes:
  sql_data:
